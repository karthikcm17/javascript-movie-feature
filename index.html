<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="movie feature" content="javascript movie feature">
    <title>DRAUMA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .navbar {
            background: #020617;
        }

        .card {
            border: none;
            border-radius: 15px;
            transition: 0.3s;

        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            height: 300px;
            object-fit: cover;
        }

        .search-box {
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark px-4 py-3">
        <div class="logo-container" onclick="showAll()" style="cursor: pointer;">
            <img src = "Assets/logo.png" height = "90px" width = "300px">
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-2 ">
            <button class = "btn btn-outline-light " onclick = "showAll()">All</button>
            <button class = "btn btn-outline-warning " onclick = "filterAction()">Action</button>
            <button class = "btn btn-outline-info " onclick = "filterThriller()">Thriller</button>
            <button class = "btn btn-outline-success " onclick = "filterAfter2012()">After 2012</button>
            <button class = "btn btn-outline-primary " onclick = "filterRating8Plus()">⭐ 8+</button>
            <button class = "btn btn-outline-secondary" onclick = "filterRating7Plus()">⭐ 7-8</button>
            <button class = "btn btn-outline-light " onclick = "findInception()">Inception</button>
        </div>
    </nav>

    <div class="container py-4">
        <div class = "row justify-content-center mb-4">
            <div class = "col-md-6 d-flex gap-2">
                <input type = "text" id="searchInput" class = "form-control search-box" placeholder = "Search movie...">
                <button class = "btn btn-outline-light" onclick = "searchMovie()">Search</button>
            </div>
        </div>

        <div id = "movie-container" class = "row g-4"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
